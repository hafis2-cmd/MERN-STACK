 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS syntax</title>
    <style>
       p{
         color: red;
         text-align: center;
       }
    </style>           <!--internal CSS(style tag within head tag)
                        declaration are given inside -->      
 </head>
 <body>
    <p>Hello world</p>
    <p>paragraphs are styled with CSS</p>
 </body>
 </html>
