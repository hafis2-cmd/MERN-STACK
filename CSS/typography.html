<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Typography</title>
    <style>
        p{
            font-family:"Times New Roman",Times,serif;
            color: blue;
            font-size: 20px;
            font-style: italic;
            font-variant: small-caps;
            font-weight: bold;
            letter-spacing: 5px;
            line-height: 50px;
            text-align: left;
            text-decoration: underline;
            text-indent: 80px;
            text-shadow: 0.5px 0px;
            text-transform: capitalize;
            word-spacing: 15px;           
        }
    </style>
</head>
<body>
    <p>
        Cascading Style Sheet is a style sheet langauge used for describing the presentation of a document more presentable.
    </p>
</body>
</html>
