 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>universal selector</title>
    <style>
        *{
            color: blue;
            background-color:chartreuse;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>This is my first heading</h1>
    <p>This is my paragraph</p>
    <b>in bold</b>
</body>
</html>

<!--Grouping selector-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouping selector</title>
    <style>
        h1,p,b{
            color: rgb(56, 117, 182);
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <h1>This is my first heading</h1>
    <p>This is my paragraph</p>
    <b>in bold</b>
    <h2>this is my second heading</h2>
</body>
</html>
